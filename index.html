<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>HovedNettside</title>
</head>
<body>

    <div  class="Menybar">
      <h1 class="TextBar">Meny</h1>
    </div>

    <button id="theme-toggle">Modus</button>


    <h2>Player 1</h2>

    <p id="count" style="font-size:40px;">0</p>

    <button onclick="increaseCount()">+</button>
    <button onclick="decreaseCount()">-</button>
    <button onclick="resetCount()">Reset</button>
    <button onclick="saveCount()">Save</button>
    <button onclick="loadCount()">Load</button>


    <h2>Player 2</h2>

    <p id="countt" style="font-size:40px;">0</p>
    
    <button onclick="increaseCountt()">+</button>
    <button onclick="decreaseCountt()">-</button>
    <button onclick="resetCountt()">Reset</button>
    <button onclick="saveCountt()">Save</button>
    <button onclick="loadCountt()">Load</button>
    
    
    <script src="script.js"></script>
</body>
</html>
